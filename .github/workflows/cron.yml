# ตั้งเวลาให้เว็บ (Vercel ฟรีตั้งเวลาได้วันละครั้ง จึงใช้ GitHub Actions แทน)
# - ทุก 15 นาที: ตรวจแจ้งเตือน (ประกาศงบ · XD · ใกล้แนวรับ · ขึ้นลงแรง) — ส่งซ้ำไม่ได้
# - ทุกวัน 05:40 น. (เวลาไทย) หลังตลาดสหรัฐปิด: บันทึกยอดพอร์ตไว้เทียบ S&P 500 / SET
name: scheduled
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "alerts หรือ snapshot"
        default: "alerts"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: alerts
        if: github.event.schedule == '*/15 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'alerts')
        run: curl -fsS --max-time 90 "https://stock-invest-eight.vercel.app/api/cron/alerts" | head -c 2000
      - name: snapshot
        if: github.event.schedule == '40 22 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'snapshot')
        run: curl -fsS --max-time 90 "https://stock-invest-eight.vercel.app/api/cron/snapshot" | head -c 2000
